[project]
name = "miron-baba-ai-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.19.1",
  "boto3==1.43.78",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.12.0",
  "pyyaml==6.0.3",
  "redis==8.1.0",
  "sqlalchemy==2.0.52",
  "temporalio==1.31.0",
  "uvicorn[standard]==0.52.4"
]

[project.optional-dependencies]
test = [
  "boto3-stubs[s3]==1.43.78",
  "hypothesis==6.165.10",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "ruff==0.16.4",
  "types-PyYAML==6.0.12.20260815"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501", # Ruff formatter owns wrapping; long literals and URLs remain readable.
  "RUF001" # Turkish dotless i is intentional in user-facing copy.
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
