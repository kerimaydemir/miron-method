name: Daily football analysis cycle

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: Cycle phase
        required: true
        default: pre_match
        type: choice
        options: [pre_match, post_match]

permissions:
  contents: write

concurrency:
  group: daily-football-analysis
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Choose phase
        id: phase
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PHASE: ${{ inputs.phase }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            phase="$MANUAL_PHASE"
          elif [ "$SCHEDULE" = "30 5 * * *" ]; then
            phase="pre_match"
          else
            phase="post_match"
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"

      - name: Create runtime env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          API_FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_API_KEY }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          AUTOMATION_TOKEN: ${{ secrets.MIRON_BABA_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          test -n "$API_FOOTBALL_API_KEY"
          test -n "$AUTOMATION_TOKEN"
          test -n "$DATA_ENCRYPTION_KEY"
          cat > .env <<EOF
          COMPOSE_PROJECT_NAME=miron-baba-ai
          PRODUCT_NAME=MİRON BABA AI
          APP_ENV=automation
          APP_TIMEZONE=Europe/Istanbul
          APP_BASE_URL=http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          API_INTERNAL_BASE_URL=http://api:8000
          DATABASE_URL=postgresql+psycopg://miron_baba_ai:local_only@postgres:5432/miron_baba_ai
          REDIS_URL=redis://redis:6379/0
          TEMPORAL_ADDRESS=temporal:7233
          TEMPORAL_NAMESPACE=miron-baba-ai
          PERSISTENCE_ENABLED=true
          S3_ENDPOINT_URL=http://minio:9000
          S3_BUCKET_SNAPSHOTS=miron-baba-ai-snapshots
          S3_ACCESS_KEY_ID=miron_baba_ai_local
          S3_SECRET_ACCESS_KEY=local_minio_secret_change_me
          MODEL_REGISTRY_PATH=config/models.yaml
          PROVIDER_REGISTRY_PATH=config/providers.yaml
          MONTHLY_BUDGET_USD=10.00
          RUN_SOFT_CAP_USD=0.50
          RUN_HARD_CAP_USD=2.00
          LOG_LEVEL=INFO
          SESSION_SECRET=github-actions-session-secret-change-me-32
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_API_BASE_URL=https://generativelanguage.googleapis.com/v1beta
          GEMINI_ENABLED=true
          LIVE_FIXTURES_ENABLED=true
          OPENLIGADB_BASE_URL=https://api.openligadb.de
          OPENLIGADB_LEAGUES=pl1,la1,bl1,it1,fr1,nl1,pt1,tr1
          OPENLIGADB_REFRESH_SECONDS=60
          THE_ODDS_API_KEY=
          THE_ODDS_API_BASE_URL=https://api.the-odds-api.com/v4
          THE_ODDS_WIDE_MARKETS=h2h,totals
          ODDS_API_IO_KEY=${ODDS_API_IO_KEY}
          ODDS_API_IO_BASE_URL=https://api.odds-api.io/v3
          ODDS_API_IO_BOOKMAKERS=Bet365,Unibet
          ODDS_API_IO_EVENTS_PER_LEAGUE=1
          ODDS_REFRESH_SECONDS=300
          AUTO_COUPON_WINDOW_DAYS=1
          AUTO_COUPON_REUSE_SECONDS=21600
          AUTO_COUPON_SETTLEMENT_SECONDS=300
          AUTOMATION_TOKEN=${AUTOMATION_TOKEN}
          FOOTBALL_DATA_API_KEY=
          FOOTBALL_DATA_BASE_URL=https://api.football-data.org/v4
          FOOTBALL_DATA_REFRESH_SECONDS=300
          API_FOOTBALL_API_KEY=${API_FOOTBALL_API_KEY}
          API_FOOTBALL_BASE_URL=https://v3.football.api-sports.io
          API_FOOTBALL_REQUESTS_PER_MINUTE=10
          API_FOOTBALL_CURRENT_ODDS_ENABLED=true
          SPORTMONKS_API_KEY=${SPORTMONKS_API_KEY}
          SPORTMONKS_BASE_URL=https://api.sportmonks.com/v3/football
          RAPIDAPI_KEY=${RAPIDAPI_KEY}
          RAPIDAPI_HOST=free-api-live-football-data.p.rapidapi.com
          RAPIDAPI_REFRESH_SECONDS=900
          RAPIDAPI_DEEP_REQUEST_LIMIT=4
          OPEN_METEO_FORECAST_BASE_URL=https://api.open-meteo.com/v1
          OPEN_METEO_GEOCODING_BASE_URL=https://geocoding-api.open-meteo.com/v1
          THESPORTSDB_API_KEY=123
          THESPORTSDB_BASE_URL=https://www.thesportsdb.com/api/v1/json
          THESPORTSDB_ENABLED=true
          SCOREBAT_API_KEY=
          SCOREBAT_BASE_URL=https://www.scorebat.com/video-api/v3
          EOF
          sed -i 's/^          //' .env
          chmod 600 .env

      - name: Restore encrypted database state
        id: restore
        run: |
          set -euo pipefail
          git fetch origin automation-state || true
          if git show origin/automation-state:state/postgres.dump.enc > "$RUNNER_TEMP/postgres.dump.enc" 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -pass env:DATA_ENCRYPTION_KEY \
              -in "$RUNNER_TEMP/postgres.dump.enc" \
              -out "$RUNNER_TEMP/postgres.dump"
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start database
        run: |
          set -euo pipefail
          docker compose up -d postgres
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U miron_baba_ai -d miron_baba_ai >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps postgres
          exit 1

      - name: Restore database dump
        if: steps.restore.outputs.restored == 'true'
        run: |
          set -euo pipefail
          docker compose exec -T postgres pg_restore \
            --clean --if-exists --no-owner \
            -U miron_baba_ai -d miron_baba_ai \
            < "$RUNNER_TEMP/postgres.dump"

      - name: Start automation stack
        run: |
          set -euo pipefail
          docker compose up -d --build api worker
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1

      - name: Run cycle
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          AUTOMATION_TOKEN: ${{ secrets.MIRON_BABA_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p reports
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 1800 \
            -X POST "http://localhost:8000/api/v1/auto-coupons/automation/daily?phase=${PHASE}" \
            -H "Authorization: Bearer ${AUTOMATION_TOKEN}" \
            -o "reports/${PHASE}.json"
          {
            echo "### MIRON BABA ${PHASE}"
            jq -r '"phase=\(.phase) day=\(.day) daily_predictions=\(.daily_prediction_count // 0) selections=\(.selection_count // 0) settled=\(.settled_count // 0) daily_reviewed=\(.daily_reviewed_count // 0) notice=\(.notice // "ok")"' "reports/${PHASE}.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump and encrypt state
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          set -euo pipefail
          docker compose exec -T postgres pg_dump -Fc \
            -U miron_baba_ai -d miron_baba_ai \
            > "$RUNNER_TEMP/postgres.dump"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass env:DATA_ENCRYPTION_KEY \
            -in "$RUNNER_TEMP/postgres.dump" \
            -out "$RUNNER_TEMP/postgres.dump.enc"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass env:DATA_ENCRYPTION_KEY \
            -in "reports/${PHASE}.json" \
            -out "$RUNNER_TEMP/${PHASE}-${GITHUB_RUN_ID}.json.enc"

      - name: Save encrypted state branch
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          set -euo pipefail
          state_worktree="$RUNNER_TEMP/automation-state"
          if git rev-parse --verify origin/automation-state >/dev/null 2>&1; then
            git worktree add "$state_worktree" origin/automation-state
            git -C "$state_worktree" switch -C automation-state
          else
            git worktree add --detach "$state_worktree"
            git -C "$state_worktree" switch --orphan automation-state
            git -C "$state_worktree" rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$state_worktree/state" "$state_worktree/reports"
          cp "$RUNNER_TEMP/postgres.dump.enc" "$state_worktree/state/postgres.dump.enc"
          cp "$RUNNER_TEMP/${PHASE}-${GITHUB_RUN_ID}.json.enc" "$state_worktree/reports/${PHASE}-${GITHUB_RUN_ID}.json.enc"
          cat > "$state_worktree/README.md" <<'EOF'
          # MIRON BABA automation state

          This branch stores encrypted automation state only. Decrypt with the repository secret value used for DATA_ENCRYPTION_KEY.
          EOF
          sed -i 's/^          //' "$state_worktree/README.md"
          git -C "$state_worktree" config user.name "github-actions[bot]"
          git -C "$state_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$state_worktree" add README.md state/postgres.dump.enc reports
          if git -C "$state_worktree" diff --cached --quiet; then
            exit 0
          fi
          git -C "$state_worktree" commit -m "Update encrypted automation state"
          git -C "$state_worktree" push origin HEAD:automation-state

      - name: Upload encrypted cycle report
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-football-cycle-${{ steps.phase.outputs.phase }}-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ steps.phase.outputs.phase }}-${{ github.run_id }}.json.enc
          if-no-files-found: error
          retention-days: 30

      - name: Docker diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200 api worker migrate postgres

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f .env "$RUNNER_TEMP/postgres.dump" "$RUNNER_TEMP/postgres.dump.enc" "$RUNNER_TEMP/${{ steps.phase.outputs.phase }}-${{ github.run_id }}.json.enc"
