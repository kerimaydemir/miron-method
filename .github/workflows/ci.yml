name: Quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Create test environment
        run: cp .env.example .env
      - name: Lint API
        run: docker compose --profile tools run --rm toolbox lint
      - name: Typecheck API
        run: docker compose --profile tools run --rm toolbox typecheck
      - name: Test API
        run: docker compose --profile test run --rm test-api
      - name: Test database migrations
        run: docker compose up --build --abort-on-container-exit --exit-code-from migrate migrate

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Create test environment
        run: cp .env.example .env
      - name: Test web
        run: docker compose --profile test run --rm test-web
